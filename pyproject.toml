[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-testkit"
version = "0.1.2"
description = "Public contract checks and installed-application tests for Toolframe developers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
  "toolframe-sdk==0.3.0", "httpx>=0.28,<1", "tomlkit>=0.13,<1", "psutil>=7,<9",
  "jsonschema>=4.23,<5", "pydantic>=2.12.5,<3",
]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-testkit"
Repository = "https://github.com/toolframe/toolframe-testkit"
Documentation = "https://github.com/toolframe/toolframe-testkit#readme"
Issues = "https://github.com/toolframe/toolframe-testkit/issues"

[project.optional-dependencies]
pytest = ["pytest>=8,<10"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2", "hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_testkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["installed_core: requires an explicitly supplied installed Core and fixture wheels"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
